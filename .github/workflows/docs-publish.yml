on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*"
      - .github/workflows/docs-publish.yml
  release:
    types: [published]
  workflow_dispatch:

name: Docs - Publish

env:
  UV_VERSION: "0.9.x"
  PYTHON_VERSION: 3.13
  QUARTO_VERSION: 1.10.18

jobs:
  docs-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history needed for correct versioning of py pkg

    - name: 🔵 Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: ${{ env.QUARTO_VERSION }}

    - name: 🚀 Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}

    - name: 🖨️ Install pandoc
      uses: r-lib/actions/setup-pandoc@v2

    - name: 📊 Install R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: 📦 Install brand_yml for Python
      run: uv sync --python ${{ env.PYTHON_VERSION }} --no-dev --group docs

    - name: 📦 Install brand.yml for R
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        working-directory: pkg-r
        extra-packages: any::pkgdown, local::.
        needs: website

    - name: 🔌 Activate venv
      run: |
        source .venv/bin/activate
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

    - name: 🏭 Update Python docs
      run: make py-docs

    - name: 🏭 Update R docs
      run: make r-docs

    - name: 🚢 Publish to GitHub Pages (and render)
      uses: quarto-dev/quarto-actions/publish@v2
      with:
        target: gh-pages
        path: docs
